<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>SAE - Sustainable Action Engine</title>
  <meta name="description" content="Empowering climate action through tools like carbon and food mile calculators. Join the sustainable movement.">

  <!-- Open Graph Meta Tags -->
  <meta property="og:title" content="Sustainable Action Engine (SAE)">
  <meta property="og:description" content="Calculate your carbon footprint and food miles. Drive sustainable action.">
  <meta property="og:image" content="https://sae.earth/images/og-image.jpg"> <!-- Replace with actual URL -->
  <meta property="og:url" content="https://sae.earth">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sustainable Action Engine (SAE)">
  <meta name="twitter:description" content="Calculate your carbon footprint and food miles. Drive sustainable action.">
  <meta name="twitter:image" content="https://sae.earth/images/og-image.jpg">

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" type="image/x-icon">

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>🌿 Sustainable Action Engine (SAE)</h1>
    <nav>
      <button onclick="showTool('carbon')">Carbon Footprint</button>
      <button onclick="showTool('foodmile')">Food Mile</button>
    </nav>
  </header>

  <main>
    <section id="carbon" class="tool-section">
      <h2>Carbon Footprint Calculator</h2>
      <label>Distance traveled (km): <input type="number" id="distance" /></label>
      <label>Vehicle emission factor (kg CO₂/km): <input type="number" id="emissionFactor" value="0.12" /></label>
      <button onclick="calculateCarbon()">Calculate</button>
      <p id="carbonResult"></p>
    </section>

    <section id="foodmile" class="tool-section" style="display:none">
      <h2>Food Mile Calculator</h2>
      <label>Distance (km): <input type="number" id="foodDistance" /></label>
      <label>Transport Mode:
        <select id="transportMode">
          <option value="0.02">Ship (0.02 kg CO₂/km/kg)</option>
          <option value="0.05">Truck (0.05 kg CO₂/km/kg)</option>
          <option value="0.15">Air (0.15 kg CO₂/km/kg)</option>
        </select>
      </label>
      <label>Weight (kg): <input type="number" id="foodWeight" /></label>
      <button onclick="calculateFoodMile()">Calculate</button>
      <p id="foodMileResult"></p>
    </section>
  </main>

  <footer>
    <p>© 2025 Sustainable Action Engine</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
